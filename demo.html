<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contact ~ /shamiltp</title>
  <style>
    /* Terminal Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Terminal Window Container */
    .terminal-container {
      width: 100%;
      max-width: 600px;
      border: 1px solid #ffffff;
      padding: 20px;
    }

    .header {
      margin-bottom: 30px;
      border-bottom: 1px dashed #ffffff;
      padding-bottom: 10px;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: normal;
    }

    /* Form Layout */
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    label::before {
      content: "$ ";
    }

    /* Inputs & Textarea */
    input, textarea {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #333333;
      padding: 10px;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    input:focus, textarea:focus {
      border: 1px solid #ffffff;
    }

    /* Terminal Button */
    button {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    button:hover, button:focus {
      background-color: #ffffff;
      color: #000000;
    }

    /* Blinking Cursor Animation */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background-color: #ffffff;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
      margin-left: 5px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="header">
      <h1>root@shamiltp.me:~/contact<span class="cursor"></span></h1>
    </div>

    <form id="contact-form">
      <div class="form-group">
        <label for="name">enter_name</label>
        <input type="text" id="name" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="email">enter_email</label>
        <input type="email" id="email" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="message">enter_message</label>
        <textarea id="message" required></textarea>
      </div>

      <button type="submit">[ EXECUTE_SEND ]</button>
    </form>
  </div>

  <script>
    const form = document.querySelector('#contact-form');
    const submitBtn = form.querySelector('button');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Update UI to show processing state
      const originalText = submitBtn.textContent;
      submitBtn.textContent = '[ PROCESSING... ]';
      submitBtn.disabled = true;

      const payload = {
        name: document.querySelector('#name').value,
        email: document.querySelector('#email').value,
        message: document.querySelector('#message').value,
      };

      try {
        const response = await fetch('https://contact.shamiltp.me/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await response.json();

        if (response.ok) {
          alert('PROCESS_SUCCESS: Message transmitted.');
          form.reset();
        } else {
          alert('PROCESS_ERROR: ' + data.error);
        }
      } catch (err) {
        console.error('Submission error:', err);
        alert('PROCESS_FATAL: Failed to connect to server.');
      } finally {
        // Restore button state
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
