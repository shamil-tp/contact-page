<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact a developer." />
  <title>Contact // Developer Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --terminal: #17191d;
      --terminal-deep: #101216;
      --ink: #f2eee4;
      --muted-ink: #c8c2b4;
      --pastel-red: #f08b8b;
      --pastel-yellow: #edcf86;
      --pastel-green: #9acb9b;
    }

    * {
      box-sizing: border-box;
      border-radius: 0;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--terminal-deep);
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      line-height: 1.45;
    }

    button,
    input,
    textarea {
      appearance: none;
      -webkit-appearance: none;
      border-radius: 0;
      color: inherit;
      font: inherit;
    }

    button:focus,
    input:focus,
    textarea:focus {
      outline: none;
    }

    ::selection {
      background: var(--ink);
      color: var(--terminal-deep);
    }

    .shell {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 48px 0;
    }

    .terminal {
      overflow: hidden;
      border: 2px solid var(--ink);
      background: var(--terminal);
      transition: max-width .25s ease, opacity .2s ease;
    }

    .terminal__bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 8px 14px;
      border-bottom: 2px solid var(--ink);
      font-size: 13px;
      letter-spacing: .04em;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .window-control {
      display: grid;
      width: 14px;
      height: 14px;
      min-height: 14px;
      padding: 0;
      border: 1px solid var(--terminal-deep);
      background: var(--control-color);
      box-shadow: none;
      cursor: pointer;
    }

    .window-control:hover,
    .window-control:focus-visible {
      border-color: var(--ink);
      outline: 1px solid var(--ink);
      outline-offset: 2px;
      box-shadow: none;
    }

    .window-control:active {
      transform: none;
      box-shadow: none;
    }

    .window-control--close { --control-color: var(--pastel-red); }
    .window-control--minimize { --control-color: var(--pastel-yellow); }
    .window-control--maximize { --control-color: var(--pastel-green); }

    .terminal__body {
      padding: clamp(24px, 5vw, 48px);
    }

    .prompt,
    .command {
      margin: 0;
    }

    .prompt {
      font-size: 14px;
    }

    .prompt::before,
    .command::before {
      content: "> ";
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 7vw, 56px);
      line-height: 1;
      letter-spacing: -.07em;
      text-transform: uppercase;
    }

    .cursor {
      display: inline-block;
      width: .55em;
      height: .92em;
      margin-left: .12em;
      vertical-align: -.08em;
      background: var(--ink);
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .intro {
      max-width: 58ch;
      margin: 0 0 34px;
    }

    .divider {
      height: 2px;
      margin: 28px 0;
      border: 0;
      background: var(--ink);
    }

    form {
      display: grid;
      gap: 22px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
    }

    label::before {
      content: "[ ";
    }

    label::after {
      content: " ]";
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--ink);
      background: var(--terminal-deep);
      caret-color: var(--ink);
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted-ink);
      opacity: .5;
    }

    input:focus,
    textarea:focus {
      background: var(--ink);
      color: var(--terminal-deep);
      box-shadow: 6px 6px 0 var(--muted-ink);
    }

    input:focus::placeholder,
    textarea:focus::placeholder {
      color: var(--terminal-deep);
      opacity: .5;
    }

    textarea {
      min-height: 150px;
    }

    .submit-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 4px;
    }

    button {
      min-height: 46px;
      padding: 10px 16px;
      border: 2px solid var(--ink);
      background: var(--ink);
      color: var(--terminal-deep);
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
    }

    button:hover,
    button:focus-visible {
      background: var(--terminal-deep);
      color: var(--ink);
      box-shadow: 5px 5px 0 var(--muted-ink);
    }

    button:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--muted-ink);
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }

    .status {
      min-height: 1.5em;
      margin: 0;
      font-size: 14px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid var(--ink);
      font-size: 12px;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .shell { width: min(100% - 20px, 760px); padding: 10px 0; }
      .terminal__bar { font-size: 11px; }
      .footer { flex-direction: column; gap: 4px; }
    }

    /* Window-control modes */
    .terminal.is-minimized .terminal__body {
      padding-block: clamp(24px, 5vw, 48px);
    }

    /* Yellow: show the page content, but remove the contact form entirely. */
    .terminal.is-minimized form {
      display: none;
    }

    /* Red: hide page content and reduce the form to its bare essentials. */
    .terminal.is-closed .terminal__body {
      display: grid;
      min-height: 300px;
      place-items: center stretch;
    }

    .terminal.is-closed .prompt,
    .terminal.is-closed .command,
    .terminal.is-closed h1,
    .terminal.is-closed .intro,
    .terminal.is-closed .divider,
    .terminal.is-closed .footer {
      display: none;
    }

    .terminal.is-closed form {
      width: min(100%, 420px);
      margin: 0 auto;
      gap: 10px;
    }

    .terminal.is-closed .field {
      gap: 0;
    }

    .terminal.is-closed label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .terminal.is-closed input,
    .terminal.is-closed textarea {
      padding: 10px 12px;
    }

    .terminal.is-closed textarea {
      min-height: 90px;
    }

    .terminal.is-closed .submit-row {
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="terminal" aria-labelledby="page-title">
      <div class="terminal__bar" aria-label="Terminal window header">
        <span>guest@portfolio: ~/contact</span>
        <div class="window-controls" aria-label="Window controls">
          <button class="window-control window-control--close" type="button" aria-label="Close contact form" title="Close contact form"></button>
          <button class="window-control window-control--minimize" type="button" aria-label="Minimize content" title="Minimize content"></button>
          <button class="window-control window-control--maximize" type="button" aria-label="Restore full content" title="Restore full content"></button>
        </div>
      </div>

      <div class="terminal__body">
        <p class="prompt">cd ~/contact</p>
        <p class="command">open contact-form</p>
        <h1 id="page-title">Transmit<span class="cursor" aria-hidden="true"></span></h1>
        <p class="intro">Have a project, opportunity, or strange idea? Leave a message below and I will get back to you.</p>

        <hr class="divider" />

        <form id="contact-form">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="YOUR_NAME" required />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="YOU@EXAMPLE.COM" required />
          </div>

          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="TYPE_MESSAGE_HERE..." required></textarea>
          </div>

          <div class="submit-row">
            <button type="submit">[ Execute ]</button>
            <p id="status" class="status" role="status" aria-live="polite"></p>
          </div>
        </form>

        <footer class="footer">
          <span>status: ready</span>
          <span>secure uplink v1.0</span>
        </footer>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("contact-form");
    const terminal = document.querySelector(".terminal");
    const submitButton = form.querySelector('button[type="submit"]');
    const status = document.getElementById("status");
    const closeButton = document.querySelector(".window-control--close");
    const minimizeButton = document.querySelector(".window-control--minimize");
    const maximizeButton = document.querySelector(".window-control--maximize");

    closeButton.addEventListener("click", () => {
      terminal.classList.remove("is-minimized");
      terminal.classList.add("is-closed");
    });

    minimizeButton.addEventListener("click", () => {
      terminal.classList.remove("is-closed");
      terminal.classList.add("is-minimized");
    });

    maximizeButton.addEventListener("click", () => {
      terminal.classList.remove("is-minimized", "is-closed");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      submitButton.disabled = true;
      submitButton.textContent = "[ Transmitting... ]";
      status.textContent = "Sending payload...";

      try {
        const response = await fetch("https://contact.shamiltp.me/api/contact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, message })
        });

        if (response.ok) {
          alert("Transmission complete. Your message has been sent.");
          form.reset();
          status.textContent = "Transmission complete.";
        } else {
          alert("Transmission failed. Please try again.");
          status.textContent = "Error: server rejected the transmission.";
        }
      } catch (error) {
        console.error("Contact form submission failed:", error);
        alert("Network error. Please check your connection and try again.");
        status.textContent = "Error: network unavailable.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "[ Execute ]";
      }
    });
  </script>
</body>
</html>
